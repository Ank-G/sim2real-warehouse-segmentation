experiment:
  name: sim2real_evaluation

dataset:
  test: configs/datasets/real_test.yaml

models:

  model_a:
    name: baseline_synthetic
    weights: results/model_a_baseline/weights/best.pt

  model_b:
    name: randomized_synthetic
    weights: results/model_b_randomized/weights/best.pt

  model_c:
    name: randomized_plus_real
    weights: results/model_c_finetuned/weights/best.pt

evaluation:
  imgsz: 640
  batch: 16
  conf: 0.001
  iou: 0.7

metrics:
  - box_map50
  - box_map50_95
  - mask_map50
  - mask_map50_95
  - precision
  - recall

output:
  directory: results/tables
  filename: model_comparison.csv